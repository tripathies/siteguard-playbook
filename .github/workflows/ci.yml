name: Validate SiteGuard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python v7
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile scripts/passive_site_check.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
